    <circle cx="1110" cy="290" r="8" fill-opacity="0.85"/>
    <circle cx="1010" cy="330" r="8" fill-opacity="0.85"/>
  </g>
  <circle cx="880" cy="250" r="24" fill="none" stroke="#2ee59d" stroke-opacity="0.45" stroke-width="2"/>
