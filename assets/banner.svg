  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="118" font-size="22" font-weight="600" letter-spacing="6" fill="#2ee59d">◈ EA FC 27 · ULTIMATE TEAM</text>
    <text x="68" y="228" font-size="112" font-weight="800" letter-spacing="-2" fill="url(#word)">Regista</text>
    <text x="72" y="282" font-size="30" font-weight="500" fill="#d6efe4">The playmaker for your Ultimate Team.</text>
    <text x="72" y="340" font-size="21" fill="#8fb8a6">Best XI  ·  Cheapest SBCs  ·  Gallery Level 10  ·  Lowest-price market</text>
